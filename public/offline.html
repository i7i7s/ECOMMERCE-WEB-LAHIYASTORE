<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kamu sedang offline · Lahiya Store</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #f5f5f7; color: #1d1d1f; font-family: -apple-system, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', sans-serif; text-align: center; }
        main { max-width: 420px; }
        .logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 19px; letter-spacing: -0.03em; }
        .logo svg { width: 28px; height: 28px; }
        h1 { margin: 40px 0 8px; font-size: 32px; letter-spacing: -0.02em; }
        p { margin: 0; color: #6e6e73; font-size: 17px; line-height: 1.5; }
        button { margin-top: 28px; min-height: 48px; padding: 0 26px; border: 0; border-radius: 999px; background: #0071e3; color: #fff; font: inherit; font-size: 17px; cursor: pointer; }
        button:hover { background: #0077ed; }
        .wifi { width: 56px; height: 56px; margin-top: 40px; color: #86868b; }
    </style>
</head>
<body>
    <main>
        <span class="logo">
            <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c2c2e"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5f8f"/><stop offset="0.55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#0071e3"/></linearGradient><clipPath id="c"><rect x="9" y="4.5" width="14" height="23" rx="4"/></clipPath></defs><rect width="32" height="32" rx="8" fill="url(#t)"/><rect x="9" y="4.5" width="14" height="23" rx="4" fill="#fff"/><g clip-path="url(#c)"><path d="M5 23.5 L27 12.5 L27 21 L5 32 Z" fill="url(#b)"/></g><rect x="11" y="6.5" width="5.6" height="5.6" rx="1.8" fill="#1d1d1f"/><circle cx="13.8" cy="9.3" r="1.25" fill="#5e5ce6"/></svg>
            lahiya

        <div><svg class="wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 4.2-2.6M10.7 5.1A15 15 0 0 1 22 8.8M5 12.6a10 10 0 0 1 3.5-2M15.5 10.6A10 10 0 0 1 19 12.6M8.5 16.4a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/></svg></div>
        <h1>Kamu sedang offline</h1>
        <p>Halaman ini butuh koneksi internet. Periksa Wi-Fi atau data selulermu. Halaman akan dimuat ulang otomatis begitu koneksi kembali.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
